<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emission Analytics Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #1a2637;
            padding: 10px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background-color: #fff;
            color: #2a5298;
        }

        main {
            padding: 60px 20px;
        }

        #chart-container {
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            font-size: 2.5rem;
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
        }

        canvas {
            background-color: #1e1e1e;
            border-radius: 10px;
        }

        footer {
            background-color: #0d0d0d;
            color: #ccc;
            text-align: center;
            padding: 20px;
            border-top: 3px solid #2196f3;
        }

        footer a {
            color: #ffcc00;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <h1>Eco Mines Emission Dashboard</h1>
    </header>

    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="benchmarking.html">Benchmarking</a></li>
            <li><a href="reduction.html">Reduction Pathways</a></li>
        </ul>
    </nav>

    <main>
        <div id="chart-container">
            <h2>Emission Metrics Over Time</h2>
            <canvas id="emissionChart" width="800" height="400"></canvas>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Eco Mines. All rights reserved. | <a href="mailto:contact@ecomines.com">contact@ecomines.com</a></p>
    </footer>

    <script>
        async function fetchEmissionData() {
            try {
                const response = await fetch('http://localhost:3000/api/analytics');
                const data = await response.json();

                const timestamps = data.map(item => item.timestamp);
                const energyConsumption = data.map(item => item.energyConsumption);
                const fuelUsage = data.map(item => item.fuelUsage);
                const coalProduction = data.map(item => item.coalProduction);
                const transportationDistance = data.map(item => item.transportationDistance);

                const ctx = document.getElementById('emissionChart').getContext('2d');

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timestamps,
                        datasets: [
                            {
                                label: 'Energy Consumption (kWh)',
                                data: energyConsumption,
                                borderColor: 'rgba(255, 99, 132, 1)',
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                tension: 0.4
                            },
                            {
                                label: 'Fuel Usage (Liters)',
                                data: fuelUsage,
                                borderColor: 'rgba(54, 162, 235, 1)',
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                tension: 0.4
                            },
                            {
                                label: 'Coal Production (Tons)',
                                data: coalProduction,
                                borderColor: 'rgba(255, 206, 86, 1)',
                                backgroundColor: 'rgba(255, 206, 86, 0.2)',
                                tension: 0.4
                            },
                            {
                                label: 'Transportation Distance (Km)',
                                data: transportationDistance,
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                tension: 0.4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: {
                                ticks: {
                                    color: '#fff'
                                }
                            },
                            y: {
                                ticks: {
                                    color: '#fff'
                                },
                                grid: {
                                    color: '#444'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#fff'
                                }
                            }
                        }
                    }
                });
            } catch (err) {
                console.error('Failed to load emission data', err);
                alert('Failed to load emission data.');
            }
        }

        fetchEmissionData();
    </script>

</body>

</html>
