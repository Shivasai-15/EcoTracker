<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emission Analytics Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            font-weight: bold;
            color: #ff9800;
        }

        canvas {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>

    <h1>Emission Analytics Graph</h1>

    <canvas id="emissionChart" width="600" height="400"></canvas>

    <script>
        async function fetchEmissionData() {
            try {
                const response = await fetch('http://localhost:3000/api/analytics');
                const data = await response.json();

                const timestamps = data.map(item => item.timestamp);
                const energyConsumption = data.map(item => item.energyConsumption);
                const fuelUsage = data.map(item => item.fuelUsage);
                const coalProduction = data.map(item => item.coalProduction);
                const transportationDistance = data.map(item => item.transportationDistance);

                const ctx = document.getElementById('emissionChart').getContext('2d');

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timestamps,
                        datasets: [
                            {
                                label: 'Energy Consumption (kWh)',
                                data: energyConsumption,
                                borderColor: 'rgba(255, 99, 132, 1)',
                                backgroundColor: 'rgba(255, 99, 132, 0.2)'
                            },
                            {
                                label: 'Fuel Usage (Liters)',
                                data: fuelUsage,
                                borderColor: 'rgba(54, 162, 235, 1)',
                                backgroundColor: 'rgba(54, 162, 235, 0.2)'
                            },
                            {
                                label: 'Coal Production (Tons)',
                                data: coalProduction,
                                borderColor: 'rgba(255, 206, 86, 1)',
                                backgroundColor: 'rgba(255, 206, 86, 0.2)'
                            },
                            {
                                label: 'Transportation Distance (Km)',
                                data: transportationDistance,
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: {
                                ticks: {
                                    color: '#ffffff'
                                }
                            },
                            y: {
                                ticks: {
                                    color: '#ffffff'
                                },
                                grid: {
                                    color: '#444'  // Dark grid lines
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#ffffff'
                                }
                            }
                        }
                    }
                });
            } catch (err) {
                console.error('Failed to load emission data', err);
                alert('Failed to load emission data.');
            }
        }

        // Fetch emission data when the page loads
        fetchEmissionData();
    </script>

</body>
</html>
