<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <title>Contact Us - Eco Mines</title>
    <style>
        body {
            background-color: #121212; /* Dark background */
            color: #e0e0e0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #1c1c1c;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #00bcd4; /* Cyan accent */
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            color: #00bcd4;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #00bcd4;
            color: #000;
        }

        .container-custom {
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 8px;
            margin: 20px auto;
            max-width: 600px;
        }

        .btn-primary {
            background-color: #00bcd4;
            border-color: #00bcd4;
        }

        .btn-primary:hover {
            background-color: #0097a7;
            border-color: #0097a7;
        }

        .form-control {
            background-color: #252525;
            color: #fff;
        }

        .form-control::placeholder {
            color: #b3b3b3;
        }

        footer {
            background-color: #1c1c1c;
            color: #808080;
            padding: 10px;
            text-align: center;
        }

        footer a {
            color: #00bcd4;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>
    <h1>Eco Mines</h1>
    <nav>
        <a href="home.html">Home</a>
        <a href="AboutUs.html">About Us</a>
        <a href="Eco.html">Data Input</a>
        <a href="ContactUs.html">Contact Us</a>
    </nav>
</header>

<div class="container-custom">
    <h2>Contact Us</h2>

    <form>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label>Are you a member?</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="membership" id="yes" value="yes" checked>
                <label class="form-check-label" for="yes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="membership" id="no" value="no">
                <label class="form-check-label" for="no">No</label>
            </div>
        </div>

        <div class="form-group">
            <label for="feedback">Feedback</label>
            <textarea class="form-control" id="feedback" rows="4" placeholder="Share your thoughts..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-2">Submit</button>
    </form>
</div>

<footer>
    <p>&copy; 2023 Eco Mines. All rights reserved. | <a href="#">Privacy</a> · <a href="#">Terms</a></p>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
