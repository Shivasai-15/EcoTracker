<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reduction Pathways</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #1a2637;
            padding: 10px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background-color: #fff;
            color: #2a5298;
        }

        main {
            padding: 60px 20px;
            text-align: center;
        }

        h2 {
            color: #ffd700;
            font-size: 2rem;
        }

        .form-group {
            margin: 20px auto;
            max-width: 400px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #ffcc00;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border: 2px solid #ffd700;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #f9d423, #ff4e50);
        }

        .result-container {
            margin-top: 40px;
            padding: 30px;
            background-color: #1e1e1e;
            border-radius: 12px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .result-container h2 {
            color: #00e676;
            margin-bottom: 15px;
        }

        ul {
            list-style: square;
            padding-left: 20px;
            text-align: left;
            color: #ccc;
        }

        footer {
            background-color: #0d0d0d;
            color: #ccc;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            border-top: 3px solid #2196f3;
        }

        footer a {
            color: #ffcc00;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Reduction Pathways</h1>
    </header>

    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="benchmarking.html">Benchmarking</a></li>
            <li><a href="reduction.html">Reduction Pathways</a></li>
        </ul>
    </nav>

    <main>
        <h2>Emission Reduction Calculator</h2>

        <div class="form-group">
            <label for="currentEmissions">Current Emissions (Tons CO₂):</label>
            <input type="number" id="currentEmissions" placeholder="Enter your current emissions" />
        </div>

        <div class="form-group">
            <label for="targetEmissions">Target Emissions (Tons CO₂):</label>
            <input type="number" id="targetEmissions" placeholder="Enter your target emissions" />
        </div>

        <button onclick="fetchReductionPathways()">Get Reduction Pathways</button>

        <div class="result-container" id="resultContainer" style="display: none;">
            <h2>Recommended Strategies</h2>
            <ul id="reductionStrategies"></ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Eco Mines. All rights reserved. | <a href="mailto:contact@ecomines.com">contact@ecomines.com</a></p>
    </footer>

    <script>
        async function fetchReductionPathways() {
            const currentEmissions = parseFloat(document.getElementById('currentEmissions').value);
            const targetEmissions = parseFloat(document.getElementById('targetEmissions').value);

            if (
                isNaN(currentEmissions) ||
                isNaN(targetEmissions) ||
                currentEmissions <= 0 ||
                targetEmissions <= 0 ||
                targetEmissions >= currentEmissions
            ) {
                alert('Please enter valid emissions data. Target must be less than current emissions.');
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/reduction-pathways', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentEmissions, targetEmissions })
                });

                const data = await response.json();

                if (response.ok) {
                    const resultContainer = document.getElementById('resultContainer');
                    const reductionStrategies = document.getElementById('reductionStrategies');

                    reductionStrategies.innerHTML = '';
                    data.strategies.forEach(strategy => {
                        const listItem = document.createElement('li');
                        listItem.textContent = strategy;
                        reductionStrategies.appendChild(listItem);
                    });

                    resultContainer.style.display = 'block';
                } else {
                    alert('Failed to fetch reduction pathways.');
                }
            } catch (error) {
                console.error('Error fetching reduction pathways:', error);
                alert('An error occurred while fetching reduction pathways.');
            }
        }
    </script>
</body>
</html>
