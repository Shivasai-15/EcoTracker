<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Benchmarking - Emissions Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #1a2637;
            padding: 10px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        nav ul li a:hover {
            background-color: #fff;
            color: #2a5298;
        }

        main {
            padding: 60px 20px;
        }

        h2 {
            font-size: 2.2rem;
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 1000px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
        }

        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
        }

        table, th, td {
            border: 1px solid #444;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2a2a2a;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #1c1c1c;
        }

        .btn {
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: #fff;
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #f9d423, #ff4e50);
        }

        canvas {
            margin-top: 30px;
            background-color: #1e1e1e;
            border-radius: 10px;
        }

        footer {
            background-color: #0d0d0d;
            color: #ccc;
            text-align: center;
            padding: 20px;
            border-top: 3px solid #2196f3;
        }

        footer a {
            color: #ffcc00;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Benchmarking Emission Metrics</h1>
    </header>

    <nav>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="benchmarking.html">Benchmarking</a></li>
            <li><a href="reduction.html">Reduction Pathways</a></li>
        </ul>
    </nav>

    <main>
        <div class="container">
            <h2>Comparison Table</h2>
            <table id="benchmarkTable">
                <tr>
                    <th>Timestamp</th>
                    <th>Energy Consumption (kWh)</th>
                    <th>Fuel Usage (Liters)</th>
                    <th>Coal Production (Tons)</th>
                    <th>Transportation Distance (Km)</th>
                </tr>
            </table>

            <canvas id="benchmarkChart" width="800" height="400"></canvas>
        </div>
    </main>

    <footer>
        <p>&copy; 2023 Eco Mines. All rights reserved. | <a href="mailto:contact@ecomines.com">contact@ecomines.com</a></p>
    </footer>

    <script>
        async function fetchBenchmarkData() {
            try {
                const response = await fetch('http://localhost:3000/api/benchmark');
                const data = await response.json();

                const timestamps = data.map(item => item.timestamp);
                const energyConsumption = data.map(item => item.energyConsumption);
                const fuelUsage = data.map(item => item.fuelUsage);
                const coalProduction = data.map(item => item.coalProduction);
                const transportationDistance = data.map(item => item.transportationDistance);

                // Populate the HTML table with data
                const table = document.getElementById('benchmarkTable');
                data.forEach(item => {
                    const row = table.insertRow();
                    row.insertCell(0).innerText = item.timestamp;
                    row.insertCell(1).innerText = item.energyConsumption;
                    row.insertCell(2).innerText = item.fuelUsage;
                    row.insertCell(3).innerText = item.coalProduction;
                    row.insertCell(4).innerText = item.transportationDistance;
                });

                // Create a bar chart
                const ctx = document.getElementById('benchmarkChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: timestamps,
                        datasets: [
                            {
                                label: 'Energy Consumption (kWh)',
                                data: energyConsumption,
                                backgroundColor: 'rgba(255, 99, 132, 0.6)'
                            },
                            {
                                label: 'Fuel Usage (Liters)',
                                data: fuelUsage,
                                backgroundColor: 'rgba(54, 162, 235, 0.6)'
                            },
                            {
                                label: 'Coal Production (Tons)',
                                data: coalProduction,
                                backgroundColor: 'rgba(255, 206, 86, 0.6)'
                            },
                            {
                                label: 'Transportation Distance (Km)',
                                data: transportationDistance,
                                backgroundColor: 'rgba(75, 192, 192, 0.6)'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: {
                                ticks: {
                                    color: '#fff'
                                }
                            },
                            y: {
                                ticks: {
                                    color: '#fff'
                                },
                                grid: {
                                    color: '#444'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#fff'
                                }
                            }
                        }
                    }
                });
            } catch (err) {
                console.error('Failed to load benchmark data', err);
                alert('Failed to load benchmarking data.');
            }
        }

        fetchBenchmarkData();
    </script>
</body>
</html>
